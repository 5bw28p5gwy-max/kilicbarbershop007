
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>KILIÇ BARBERSHOP | Online Randevu</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101112;
  --panel: #1a1b1d;
  --muted: #a5a5a5;
  --gold: #c9ad78;
  --line: #343434;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #252321 0, #101112 55%);
  color: #f5f3ef;
  font-family: Arial, Helvetica, sans-serif;
}
.wrap {
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 28px 18px 50px;
}
.brand {
  text-align: center;
  padding: 28px 12px 22px;
}
.mark {
  font-family: Georgia, serif;
  font-size: 54px;
  color: var(--gold);
  line-height: 1;
}
.brand h1 {
  font-family: Georgia, serif;
  letter-spacing: 4px;
  font-size: 25px;
  margin: 12px 0 6px;
}
.brand p {
  letter-spacing: 3px;
  color: var(--gold);
  font-size: 11px;
  margin: 0;
}
.sub {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  margin-top: 16px;
}
.card {
  background: rgba(26,27,29,.96);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  margin-top: 16px;
  box-shadow: 0 12px 36px #0005;
}
h2 {
  font-size: 17px;
  margin: 0 0 18px;
  letter-spacing: 1px;
  color: var(--gold);
}
.field { margin-bottom: 16px; }
label {
  display: block;
  font-size: 12px;
  color: #c9c5bd;
  margin-bottom: 7px;
}
input, select {
  width: 100%;
  padding: 14px 13px;
  background: #101112;
  color: #f5f3ef;
  border: 1px solid #444;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}
input:focus, select:focus { border-color: var(--gold); }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.hint {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}
.btn {
  width: 100%;
  border: 0;
  border-radius: 9px;
  background: var(--gold);
  color: #171513;
  padding: 15px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
}
.btn:disabled {
  opacity: .55;
  cursor: wait;
}
.status {
  margin-top: 14px;
  padding: 12px;
  border-radius: 9px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
  overflow-wrap: anywhere;
}
.status.show { display: block; }
.status.ok {
  background: #183126;
  border: 1px solid #35694d;
  color: #c9f2d8;
}
.status.err {
  background: #3a2020;
  border: 1px solid #744040;
  color: #ffd4d4;
}
.foot {
  text-align: center;
  color: #777;
  font-size: 11px;
  margin: 22px 0;
}
@media(max-width:520px) {
  .grid { grid-template-columns: 1fr; gap: 0; }
  .card { padding: 18px; }
  .brand h1 { font-size: 21px; }
}
</style>
</head>

<body>
<main class="wrap">

<header class="brand">
  <div class="mark">K</div>
  <h1>KILIÇ BARBERSHOP</h1>
  <p>HOUSE OF SELECTED</p>
  <div class="sub">
    LOOK GOOD – FEEL GOOD<br>
    Online Randevu Sistemi
  </div>
</header>

<section class="card">
  <h2>RANDEVUNU OLUŞTUR</h2>

  <div class="field">
    <label for="service">Hizmet seç</label>
    <select id="service">
      <option value="">Hizmetler yükleniyor...</option>
    </select>
  </div>

  <div class="field">
    <label for="barber">Berberini seç</label>
    <select id="barber">
      <option value="">Berberler yükleniyor...</option>
    </select>
  </div>

  <div class="grid">
    <div class="field">
      <label for="date">Tarih</label>
      <input id="date" type="date">
    </div>

    <div class="field">
      <label for="time">Saat</label>
      <select id="time" disabled>
        <option value="">Önce hizmet, berber ve tarih seçin</option>
      </select>
    </div>
  </div>

  <div class="field">
    <label for="customer">Ad soyad</label>
    <input
      id="customer"
      type="text"
      maxlength="100"
      placeholder="Adınız ve soyadınız"
      autocomplete="name"
      required
    >
  </div>

  <div class="field">
    <label for="phone">Telefon numarası (zorunlu)</label>
    <input
      id="phone"
      type="tel"
      maxlength="20"
      placeholder="05XX XXX XX XX"
      autocomplete="tel"
      required
    >
  </div>

  <p class="hint">
    Çalışma saatleri: Pazartesi–Cumartesi, 10.00–23.00.
    Pazar kapalıdır. Randevular berberin uygunluğuna göre oluşturulur.
  </p>

  <button class="btn" id="book" type="button">RANDEVU AL</button>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</section>

<div class="foot">KILIÇ BARBERSHOP · MANAVGAT</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
'use strict';

/* SUPABASE BAĞLANTISI */
const SUPABASE_URL = 'https://trrspituarolojducqni.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jvxdGG3AIOUHcLESN4n77g_8tHn-ne7';

const $ = id => document.getElementById(id);

let db;
let services = [];
let barbers = [];
let slotRequest = 0;

const pad = number => String(number).padStart(2, '0');

function localDate(date) {
  return [
    date.getFullYear(),
    pad(date.getMonth() + 1),
    pad(date.getDate())
  ].join('-');
}

/* TARİH VE SAATİ TARAYICININ YEREL SAATİYLE OLUŞTUR */
function parseLocal(date, hour) {
  return new Date(date + 'T' + hour + ':00');
}

/* MESAJLAR */
function message(text, type = 'error') {
  const status = $('status');
  status.textContent = String(text || 'Beklenmeyen bir hata oluştu.');
  status.className = 'status show ' + (type === 'success' ? 'ok' : 'err');
}

function hideMessage() {
  const status = $('status');
  status.textContent = '';
  status.className = 'status';
}

function showError(error, fallback) {
  console.error('KILIÇ BARBERSHOP:', error);
  const detail = error && error.message ? error.message : fallback;
  message(detail || 'Beklenmeyen bir hata oluştu.', 'error');
}

/* SEÇİMLER */
function selectedService() {
  return services.find(item => String(item.id) === $('service').value);
}

function selectedBarber() {
  return barbers.find(item => String(item.id) === $('barber').value);
}

function overlaps(a, b, c, d) {
  return a < d && b > c;
}

function setOptions(select, placeholder, items, makeLabel) {
  select.replaceChildren();

  const first = document.createElement('option');
  first.value = '';
  first.textContent = placeholder;
  select.appendChild(first);

  items.forEach(item => {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = makeLabel(item);
    select.appendChild(option);
  });
}

/* HİZMETLERİ VE BERBERLERİ YÜKLE */
async function load() {
  $('service').disabled = true;
  $('barber').disabled = true;

  try {
    if (!window.supabase) {
      throw new Error('Supabase bağlantı kütüphanesi yüklenemedi. Sayfayı yenileyin.');
    }

    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const [serviceResult, barberResult] = await Promise.all([
      db.from('services')
        .select('id,name,price,duration_minutes')
        .eq('active', true)
        .order('name'),

      db.from('barbers')
        .select('id,name')
        .eq('active', true)
        .order('name')
    ]);

    if (serviceResult.error) throw serviceResult.error;
    if (barberResult.error) throw barberResult.error;

    services = serviceResult.data || [];
    barbers = barberResult.data || [];

    if (!services.length) {
      throw new Error('Aktif hizmet bulunamadı. Hizmet kayıtlarını kontrol edin.');
    }

    if (!barbers.length) {
      throw new Error('Aktif berber bulunamadı. Berber kayıtlarını kontrol edin.');
    }

    setOptions(
      $('service'),
      'Hizmet seçiniz',
      services,
      item => `${item.name} – ${item.price} TL (${item.duration_minutes} dk)`
    );

    setOptions(
      $('barber'),
      'Berber seçiniz',
      barbers,
      item => item.name
    );

    $('service').disabled = false;
    $('barber').disabled = false;

  } catch (error) {
    showError(error, 'Hizmet ve berber bilgileri yüklenemedi.');
  }
}

/* UYGUN SAATLERİ HESAPLA */
async function slots() {
  const requestNumber = ++slotRequest;

  hideMessage();

  const timeSelect = $('time');
  timeSelect.disabled = true;
  timeSelect.innerHTML = '<option value="">Uygun saatler aranıyor...</option>';

  const date = $('date').value;
  const barber = selectedBarber();
  const service = selectedService();

  if (!date || !barber || !service) {
    timeSelect.innerHTML = '<option value="">Önce hizmet, berber ve tarih seçin</option>';
    return;
  }

  const chosenDay = new Date(date + 'T12:00:00').getDay();

  if (chosenDay === 0) {
    timeSelect.innerHTML = '<option value="">Pazar günü kapalıyız</option>';
    return;
  }

  const from = parseLocal(date, '10:00');
  const until = parseLocal(date, '23:00');

  if (isNaN(from.getTime()) || isNaN(until.getTime())) {
    timeSelect.innerHTML = '<option value="">Geçersiz tarih</option>';
    return;
  }

  try {
    const result = await db.rpc('get_booked_slots', {
      p_barber_id: barber.id,
      p_from: from.toISOString(),
      p_until: until.toISOString()
    });

    if (requestNumber !== slotRequest) return;

    if (result.error) throw result.error;

    const busy = result.data || [];

    if (!Array.isArray(busy)) {
      throw new Error('Dolu saat bilgisi beklenen formatta gelmedi.');
    }

    const now = new Date();
    const options = [];

    for (let hour = 10; hour <= 22; hour++) {
      const time = `${pad(hour)}:00`;
      const start = parseLocal(date, time);
      const end = new Date(start.getTime() + Number(service.duration_minutes) * 60000);

      if (
        isNaN(start.getTime()) ||
        isNaN(end.getTime()) ||
        start <= now ||
        end > until
      ) {
        continue;
      }

      const isBusy = busy.some(item => {
        const busyStart = new Date(item.start_at).getTime();
        const busyEnd = new Date(item.end_at).getTime();

        if (!Number.isFinite(busyStart) || !Number.isFinite(busyEnd)) {
          return false;
        }

        return overlaps(
          start.getTime(),
          end.getTime(),
          busyStart,
          busyEnd
        );
      });

      if (!isBusy) options.push(time);
    }

    if (!options.length) {
      timeSelect.innerHTML = '<option value="">Uygun saat yok</option>';
      return;
    }

    timeSelect.replaceChildren();

    const first = document.createElement('option');
    first.value = '';
    first.textContent = 'Saat seçiniz';
    timeSelect.appendChild(first);

    options.forEach(time => {
      const option = document.createElement('option');
      option.value = time;
      option.textContent = time;
      timeSelect.appendChild(option);
    });

    timeSelect.disabled = false;

  } catch (error) {
    if (requestNumber !== slotRequest) return;

    timeSelect.innerHTML = '<option value="">Saatler yüklenemedi</option>';
    showError(error, 'Uygun saatler alınamadı.');
  }
}

/* RANDEVU KAYDET */
async function bookAppointment() {
  hideMessage();

  const button = $('book');

  const service = selectedService();
  const barber = selectedBarber();
  const date = $('date').value;
  const time = $('time').value;
  const name = $('customer').value.trim();
  const phone = $('phone').value.trim();

  if (!service || !barber || !date || !time || !name || !phone) {
    message('Lütfen hizmet, berber, tarih, saat, ad soyad ve telefon alanlarının tamamını doldurun.');
    return;
  }

  if (name.length < 2) {
    message('Lütfen geçerli bir ad soyad girin.');
    return;
  }

  if (!/^\+?[0-9 ()-]{10,20}$/.test(phone)) {
    message('Lütfen geçerli bir telefon numarası girin.');
    return;
  }

  const selectedDay = new Date(date + 'T12:00:00').getDay();

  if (selectedDay === 0) {
    message('Pazar günü randevu alamıyoruz.');
    return;
  }

  const start = parseLocal(date, time);
  const end = new Date(
    start.getTime() + Number(service.duration_minutes) * 60000
  );

  const opening = parseLocal(date, '10:00');
  const closing = parseLocal(date, '23:00');

  if (
    isNaN(start.getTime()) ||
    isNaN(end.getTime()) ||
    start < opening ||
    end > closing ||
    start <= new Date()
  ) {
    message('Seçtiğiniz tarih veya saat geçerli değil. Lütfen yeniden seçin.');
    return;
  }

  if (!Number.isFinite(Number(service.duration_minutes)) || Number(service.duration_minutes) <= 0) {
    message('Hizmet süresi geçersiz. Lütfen işletmeyle iletişime geçin.');
    return;
  }

  button.disabled = true;
  button.textContent = 'KAYDEDİLİYOR...';

  try {
    const { error } = await db.from('appointments').insert({
      customer_name: name,
      customer_phone: phone,
      barber_id: barber.id,
      service_id: service.id,
      start_at: start.toISOString(),
      end_at: end.toISOString(),
      status: 'booked'
    });

    if (error) {
      if (error.code === '23P01') {
        throw new Error('Bu saat az önce doldu. Lütfen başka bir saat seçin.');
      }
      throw error;
    }

    message(
      `Randevunuz kaydedildi! ${date} günü saat ${time} için ${barber.name} ile ${service.name}. Teşekkür ederiz.`,
      'success'
    );

    $('time').value = '';
    await slots();

  } catch (error) {
    showError(error, 'Randevu kaydedilemedi. Lütfen tekrar deneyin.');
  } finally {
    button.disabled = false;
    button.textContent = 'RANDEVU AL';
  }
}

/* SAYFA BAŞLATMA */
$('date').min = localDate(new Date());

['service', 'barber', 'date'].forEach(id => {
  $(id).addEventListener('change', slots);
});

$('book').addEventListener('click', bookAppointment);

load();
</script>
</body>
</html>
